<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>পকেট খরচ ইনকাম করুন</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Hind Siliguri', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        appGreen: '#16a34a',
                        appDark: '#0f172a',
                        appCard: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Hind Siliguri', 'Inter', sans-serif;
            background: linear-gradient(180deg, #dcfce7 0%, #f0fdf4 40%, #e2e8f0 100%);
            user-select: none;
            -webkit-user-select: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .golden-btn {
            background: linear-gradient(180deg, #facc15 0%, #eab308 50%, #ca8a04 100%);
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.35);
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto overflow-hidden relative bg-slate-900 text-slate-800">

    <!-- Top Bar -->
    <header class="bg-gradient-to-r from-emerald-600 to-green-700 text-white px-4 py-3 flex justify-between items-center z-20 shadow">
        <div class="flex items-center space-x-2">
            <span class="font-extrabold text-base tracking-wide">পকেট খরচ ইনকাম করুন</span>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="closeApp()" class="text-white hover:opacity-80">
                <i class="fa-solid text-xl fa-xmark"></i>
            </button>
        </div>
    </header>

    <!-- User Header -->
    <div class="bg-emerald-800 text-white px-4 py-2 flex justify-between items-center z-10 shadow-sm text-xs">
        <div class="flex items-center space-x-2">
            <img id="userAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-8 h-8 rounded-full border border-yellow-400 object-cover">
            <div>
                <p id="headerName" class="font-bold truncate max-w-[110px]">User</p>
                <p id="headerUserId" class="text-[10px] text-emerald-200 font-mono">ID: ...</p>
            </div>
        </div>
        <div class="bg-emerald-950/70 border border-emerald-500/40 rounded-full px-3 py-1 flex items-center space-x-1.5 font-bold text-yellow-300">
            <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
            <span>14 ONLINE</span>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-4 pt-3 pb-24 space-y-4" id="mainContent">

        <!-- Tab: Home -->
        <div id="tab-home" class="tab-content space-y-4">
            <div class="bg-gradient-to-tr from-emerald-600 via-teal-600 to-emerald-700 rounded-3xl p-5 text-white shadow-xl relative overflow-hidden">
                <p class="text-xs font-semibold text-emerald-100 uppercase tracking-wider">মোট ব্যালেন্স</p>
                <div class="flex items-baseline space-x-1 my-1">
                    <span class="text-yellow-300 text-2xl font-black">$</span>
                    <span class="text-4xl font-extrabold" id="homeBalance">0.00</span>
                    <span class="text-xs text-emerald-200 font-bold">USD</span>
                </div>
                <button onclick="openModal('withdrawModal')" class="w-full mt-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-900 py-2.5 rounded-xl font-black text-xs shadow flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-wallet"></i>
                    <span>টাকা উত্তোলন (Withdraw)</span>
                </button>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <button onclick="switchTab('tab-earn', 1)" class="glass-card p-3 rounded-2xl flex flex-col items-center justify-center space-y-1 shadow">
                    <i class="fa-solid fa-list-check text-emerald-600 text-xl"></i>
                    <span class="text-xs font-bold">টাস্ক</span>
                </button>
                <button onclick="switchTab('tab-refer', 2)" class="glass-card p-3 rounded-2xl flex flex-col items-center justify-center space-y-1 shadow">
                    <i class="fa-solid fa-users text-blue-600 text-xl"></i>
                    <span class="text-xs font-bold">রেফার</span>
                </button>
                <button onclick="openModal('withdrawModal')" class="glass-card p-3 rounded-2xl flex flex-col items-center justify-center space-y-1 shadow">
                    <i class="fa-solid fa-money-bill-transfer text-amber-500 text-xl"></i>
                    <span class="text-xs font-bold">উইথড্র</span>
                </button>
            </div>
        </div>

        <!-- Tab: Earn -->
        <div id="tab-earn" class="tab-content hidden space-y-3">
            <h3 class="text-sm font-bold text-slate-800">উপলব্ধ কাজসমূহ (Tasks & Visits)</h3>
            <div id="jobsList" class="space-y-2.5"></div>
        </div>

        <!-- Tab: Refer -->
        <div id="tab-refer" class="tab-content hidden space-y-4">
            <div class="bg-slate-900 rounded-3xl p-5 text-white space-y-3 border border-slate-700 shadow-xl text-center">
                <h3 class="text-lg font-black text-yellow-400">প্রতি রেফারে সরাসরি বোনাস!</h3>
                <p class="text-xs text-slate-300">বন্ধুদের ইনভাইট করুন এবং একাউন্টে যোগ করে নিন অতিরিক্ত ব্যালেন্স।</p>
                
                <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-around text-center">
                    <div>
                        <p class="text-xl font-black text-green-400" id="refCount">0</p>
                        <p class="text-[10px] text-slate-400 uppercase">মোট রেফার</p>
                    </div>
                    <div>
                        <p class="text-xl font-black text-yellow-400" id="refBonus">$0.00</p>
                        <p class="text-[10px] text-slate-400 uppercase">রেফার বোনাস</p>
                    </div>
                </div>

                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-700 flex items-center justify-between">
                    <span class="text-xs text-slate-300 truncate font-mono px-2" id="refLinkText">...</span>
                    <button onclick="copyRefLink()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3 py-1.5 rounded-lg">Copy</button>
                </div>

                <button onclick="shareInvite()" class="w-full golden-btn text-slate-900 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-share-nodes"></i>
                    <span>টেলিগ্রামে বন্ধুদের পাঠান</span>
                </button>
            </div>
        </div>

    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900 text-slate-400 px-4 py-2 flex justify-around items-center z-30 border-t border-slate-800">
        <button onclick="switchTab('tab-home', 0)" class="nav-item active flex flex-col items-center py-1 text-emerald-400">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-bold mt-1">হোম</span>
        </button>
        <button onclick="switchTab('tab-earn', 1)" class="nav-item flex flex-col items-center py-1 hover:text-white">
            <i class="fa-solid fa-coins text-lg"></i>
            <span class="text-[10px] font-bold mt-1">ইনকাম</span>
        </button>
        <button onclick="switchTab('tab-refer', 2)" class="nav-item flex flex-col items-center py-1 hover:text-white">
            <i class="fa-solid fa-users text-lg"></i>
            <span class="text-[10px] font-bold mt-1">রেফার</span>
        </button>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-12 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none">
        <div class="bg-slate-900/95 text-white font-bold text-xs px-4 py-2 rounded-full border border-emerald-500/50 shadow-2xl flex items-center space-x-2">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toastMsg"></span>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div id="withdrawModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-extrabold text-base text-slate-900">টাকা উত্তোলন (Withdraw)</h3>
                <button onclick="closeModal('withdrawModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">পেমেন্ট মেথড</label>
                    <select id="wMethod" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold">
                        <option value="bKash">bKash (বিকাশ Personal)</option>
                        <option value="Nagad">Nagad (নগদ Personal)</option>
                        <option value="USDT">Binance USDT (TRC20)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">একাউন্ট নম্বর / অ্যাড্রেস</label>
                    <input type="text" id="wAccount" placeholder="017XXXXXXXX" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">পরিমাণ ($)</label>
                    <input type="number" id="wAmount" value="10.00" min="10" step="0.5" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold">
                    <p class="text-[10px] text-slate-500 mt-1">সর্বনিম্ন উইথড্র $10.00 USD</p>
                </div>
            </div>
            <button onclick="processWithdraw()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl shadow">উইথড্র সাবমিট করুন</button>
        </div>
    </div>

    <!-- Script -->
    <script>
        const BOT_USERNAME = "Bdincomepro24_bot";
        const firebaseConfig = {
            databaseURL: "https://trend-video-hub-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let user = {
            id: "",
            name: "User",
            balance: 0.00,
            joined: 0
        };
        let tasks = [];

        document.addEventListener("DOMContentLoaded", () => {
            initUser();
            listenToTasks();
        });

        function initUser() {
            let tgId = "";
            let tgName = "";
            let tgPhoto = "";

            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
                if (tg.initDataUnsafe?.user) {
                    const u = tg.initDataUnsafe.user;
                    tgId = String(u.id);
                    tgName = u.first_name + (u.last_name ? " " + u.last_name : "");
                    if (u.photo_url) tgPhoto = u.photo_url;
                }
            }

            if (!tgId) {
                let savedId = localStorage.getItem('pki_user_id');
                if (!savedId) {
                    savedId = String(Math.floor(10000000 + Math.random() * 90000000));
                    localStorage.setItem('pki_user_id', savedId);
                }
                tgId = savedId;
                tgName = "Rostom Ali";
            }

            user.id = tgId;
            user.name = tgName || "User";

            if (tgPhoto) document.getElementById('userAvatar').src = tgPhoto;

            // Cloud DB listener
            db.ref('users/' + user.id).on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    user.balance = Number(data.balance || 0);
                    user.joined = data.joined || 0;
                } else {
                    db.ref('users/' + user.id).set({
                        id: user.id,
                        name: user.name,
                        balance: 0.00,
                        joined: 0
                    });
                }
                updateUI();
            });

            checkReferral(user.id);
            updateUI();
        }

        function checkReferral(uid) {
            let refId = null;
            const tg = window.Telegram?.WebApp;
            if (tg?.initDataUnsafe?.start_param) {
                refId = String(tg.initDataUnsafe.start_param);
            } else {
                const params = new URLSearchParams(window.location.search);
                refId = params.get('start');
            }

            if (refId && refId !== uid) {
                const already = localStorage.getItem('pki_ref_done');
                if (!already) {
                    localStorage.setItem('pki_ref_done', 'true');
                    db.ref('users/' + refId).transaction((u) => {
                        if (u) {
                            u.joined = (u.joined || 0) + 1;
                            u.balance = (u.balance || 0) + 1.00;
                        }
                        return u;
                    });
                }
            }
        }

        function updateUI() {
            document.getElementById('headerName').innerText = user.name;
            document.getElementById('headerUserId').innerText = "ID: " + user.id;
            document.getElementById('homeBalance').innerText = Number(user.balance).toFixed(2);
            document.getElementById('refCount').innerText = user.joined || 0;
            document.getElementById('refBonus').innerText = "$" + Number(user.joined * 1.00).toFixed(2);
            document.getElementById('refLinkText').innerText = `https://t.me/${BOT_USERNAME}?start=${user.id}`;
        }

        function listenToTasks() {
            db.ref('tasks').on('value', (snap) => {
                const data = snap.val();
                tasks = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
                renderTasks();
            });
        }

        function renderTasks() {
            const list = document.getElementById('jobsList');
            list.innerHTML = "";
            if (tasks.length === 0) {
                list.innerHTML = `<div class="glass-card p-6 text-center text-xs text-slate-500 rounded-2xl">কোনো কাজ অবশিষ্ট নেই।</div>`;
                return;
            }

            tasks.forEach(t => {
                list.innerHTML += `
                    <div class="glass-card p-3 rounded-2xl flex items-center justify-between shadow-sm">
                        <div>
                            <p class="font-bold text-xs text-slate-900">${t.title}</p>
                            <p class="text-[10px] font-bold text-emerald-600">+$${Number(t.reward).toFixed(2)} • <span class="text-slate-400">${t.timer}s</span></p>
                        </div>
                        <button onclick="startTask(this, ${t.reward}, ${t.timer}, '${t.url}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3.5 py-1.5 rounded-xl">Start</button>
                    </div>
                `;
            });
        }

        function startTask(btn, reward, timer, url) {
            if (btn.disabled) return;
            btn.disabled = true;
            if (url) window.open(url, '_blank');

            let left = timer;
            btn.className = "bg-amber-500 text-white font-bold text-xs px-3.5 py-1.5 rounded-xl";
            const timerId = setInterval(() => {
                btn.innerText = `${left}s`;
                left--;
                if (left < 0) {
                    clearInterval(timerId);
                    btn.className = "bg-green-700 text-white font-bold text-xs px-3.5 py-1.5 rounded-xl";
                    btn.innerText = "Done";
                    user.balance += reward;
                    db.ref('users/' + user.id).update({ balance: user.balance });
                    showToast(`+$${reward.toFixed(2)} একাউন্টে যোগ হয়েছে!`);
                }
            }, 1000);
        }

        function processWithdraw() {
            const amt = parseFloat(document.getElementById('wAmount').value);
            const method = document.getElementById('wMethod').value;
            const acc = document.getElementById('wAccount').value.trim();

            if (isNaN(amt) || amt < 10) return showToast('সর্বনিম্ন উইথড্র $10');
            if (user.balance < amt) return showToast('পর্যাপ্ত ব্যালেন্স নেই!');
            if (!acc) return showToast('একাউন্ট নম্বর দিন!');

            user.balance -= amt;
            const wid = "W" + Date.now().toString().slice(-5);
            db.ref('withdrawals/' + wid).set({
                id: wid,
                userId: user.id,
                username: user.name,
                method: method,
                account: acc,
                amount: amt,
                status: 'Pending'
            });
            db.ref('users/' + user.id).update({ balance: user.balance });
            closeModal('withdrawModal');
            showToast('উইথড্র রিকোয়েস্ট জমা হয়েছে!');
        }

        function copyRefLink() {
            navigator.clipboard.writeText(`https://t.me/${BOT_USERNAME}?start=${user.id}`);
            showToast('রেফারেল লিংক কপি হয়েছে!');
        }

        function shareInvite() {
            const url = `https://t.me/${BOT_USERNAME}?start=${user.id}`;
            const text = encodeURIComponent("পকেট খরচ ইনকাম করুন - ছোট ছোট কাজ করে টাকা আয় করুন!");
            window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${text}`, '_blank');
        }

        function switchTab(id, idx) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            const navs = document.querySelectorAll('.nav-item');
            navs.forEach((n, i) => {
                if (i === idx) n.className = "nav-item flex flex-col items-center py-1 text-emerald-400";
                else n.className = "nav-item flex flex-col items-center py-1 hover:text-white";
            });
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function closeApp() { window.Telegram?.WebApp?.close(); }

        function showToast(m) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = m;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2200);
        }
    </script>
</body>
</html>
